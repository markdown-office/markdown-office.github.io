name: pages

on:
  push:
    branches: [main]
  # The site is built on every pull request as well, so that a pull request which breaks the
  # build says so before it is merged rather than after the site is published.
  pull_request:
  workflow_dispatch:

# Read-only by default. The job that publishes widens this to what Pages needs.
permissions:
  contents: read

# One run per branch, and none of them cancels another: a deployment that is interrupted
# half way leaves a site that is neither the old one nor the new one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The address the site is served from, path included. The path in it is the path the
      # site is mounted under, so this one setting decides both the canonical addresses and
      # the links in the built pages.
      MARKDOWN_OFFICE_CANONICAL: https://markdown-office.github.io
    steps:
      # This repository with the three libraries beside it, because the manifest's `path`
      # entries resolve by directory and `../markdown-word` means nothing in any other
      # arrangement. The checkout of this repository therefore goes into a directory of its
      # own, and the libraries into the ones beside it.
      - name: Check out the documentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: documentation

      - name: Check out markdown-word
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: markdown-office/markdown-word
          ref: main
          path: markdown-word

      - name: Check out markdown-presentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: markdown-office/markdown-presentation
          ref: main
          path: markdown-presentation

      - name: Check out commonmark-generic-directives
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: markdown-office/commonmark-generic-directives
          ref: main
          path: commonmark-generic-directives

      # The command line, for the check that compares the pages against it. It is the fourth
      # repository of the suite, and the pages under `content/command-line/` are the only
      # place it is documented — so the pages are checked against the program, rather than
      # against what somebody remembered of it.
      #
      # It goes beside the two libraries rather than inside this repository, because its own
      # manifest resolves them by directory, and `../markdown-word` means nothing in any
      # other arrangement.
      - name: Check out mdoffice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: markdown-office/mdoffice
          ref: main
          path: mdoffice

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, zip
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: documentation/package-lock.json

      - name: Install the libraries
        working-directory: documentation
        run: composer install --no-interaction --no-progress

      # The command line's own dependencies. The script is the repository's own, because it
      # knows that the manifest resolves the two libraries by directory and that a lock would
      # record whichever branches those checkouts happened to be on.
      - name: Install the command line
        working-directory: mdoffice
        run: tools/install.sh --no-dev

      - name: Install Eleventy
        working-directory: documentation
        run: npm ci

      # The page images of every example, which are what a reader sees instead of a list of
      # the document's paragraphs. The build asks WordCraft to draw a `.docx` and DeckCraft to
      # draw a `.pptx`, and without them it falls back to the outline — which is evidence, but a
      # poor picture of a document.
      #
      # Both are fetched by the checksum of the release rather than by its name, and the hash is
      # written down here rather than taken from the file next to the download: a checksum that
      # travels with the file it checks proves nothing.
      #
      # PyMuPDF in a venv of its own: the runner's Python is managed by the operating system,
      # and installing into it is refused.
      - name: Install the preview tools
        env:
          WORDCRAFT_VERSION: '0.9.0'
          WORDCRAFT_SHA256: '8f507802e971b16afa1b6dc565317eb30885ffb2aec2e976d3a1ddaa47c529d4'
          DECKCRAFT_VERSION: '0.9.0'
          DECKCRAFT_SHA256: '531b4c8cd434ca767ef21da0d44e099664af5d5d968b038bc8f927717f8fa8f1'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-venv
          python3 -m venv "$RUNNER_TEMP/preview"
          "$RUNNER_TEMP/preview/bin/pip" install --no-cache-dir pymupdf
          echo "$RUNNER_TEMP/preview/bin" >> "$GITHUB_PATH"

          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          for tool in wordcraft deckcraft; do
            version_var="${tool^^}_VERSION"
            sha_var="${tool^^}_SHA256"
            version="${!version_var}"
            sha="${!sha_var}"

            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --output "$RUNNER_TEMP/$tool.tar.gz" \
              "https://github.com/storytold/$tool/releases/download/v$version/$tool-$version-linux-x86_64.tar.gz"

            echo "$sha  $RUNNER_TEMP/$tool.tar.gz" | sha256sum --check --strict

            tar --extract --gzip --file "$RUNNER_TEMP/$tool.tar.gz" --directory "$RUNNER_TEMP"
            install --mode 0755 \
              "$RUNNER_TEMP/$tool-$version-linux-x86_64/bin/$tool-cli" \
              "$RUNNER_TEMP/bin/$tool-cli"
          done

          # By their own path: `$GITHUB_PATH` takes effect in the steps that follow this one,
          # not in this one, and a version check that cannot find the tool says nothing.
          "$RUNNER_TEMP/bin/wordcraft-cli" --version
          "$RUNNER_TEMP/bin/deckcraft-cli" --version

      # The strict build, not the plain one: an example that does not build is rendered
      # into the page as "This example did not build", and the build succeeds anyway.
      # A green build with a broken example on it is the failure this step exists to
      # catch, so the strict flag is the one that is asked for.
      - name: Build the site
        working-directory: documentation
        run: npm run build:strict

      # The reference tables are written by hand, and a hand-written list is correct
      # only until the code moves. Each vocabulary is read out of the library that
      # owns it and the page that carries it is read for the names it lists, and the
      # two are compared in both directions.
      - name: The reference tables list what the libraries have
        working-directory: documentation
        run: php tools/check-reference.php

      # The claims the pages make in prose — the counts, the completeness, the rules —
      # which a table cannot carry and a name cannot say.
      - name: The claims the pages make
        working-directory: documentation
        run: vendor/bin/pest

      # A site whose links 404 is worse than no site, and nothing else says so: the build
      # succeeds, the pages are there, and the reader is the one who finds out.
      - name: The site's own links
        working-directory: documentation
        run: php tools/check-site-links.php

      # The pages under `content/command-line/` are written by hand, and nothing else says
      # whether they still describe the program. A command that is implemented and not
      # documented, an option that is renamed, a summary that is a word out of date — each
      # of those is found by a reader, at a terminal, at the worst possible moment.
      - name: The command-line pages describe the command line
        working-directory: documentation
        run: php tools/check-command-line.php ../mdoffice

      # The READMEs of the sibling repositories are the way a reader finds the pages, and a
      # README that has stopped pointing at them is a page nobody can reach.
      - name: The READMEs point at the command-line page
        working-directory: documentation
        run: php tools/check-readme-links.php ../markdown-word ../markdown-presentation ../mdoffice

      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: documentation/_site

  deploy:
    name: publish the site
    needs: build
    # Only from the branch the site is published from. A pull request builds the site and
    # proves it is sound; it does not publish it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages site has to exist and has to be built by this workflow. The action cannot
      # create it with the workflow's own token — that needs one of an administrator's — so
      # it is enabled on the repository, and this is what says so when it is not.
      - name: Check the Pages site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
